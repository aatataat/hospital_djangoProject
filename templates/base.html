<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIMRS - Amanah Medical Centre{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            overflow-x: hidden;
        }
        #sidebar {
            width: 260px;
            min-height: 100vh;
            background: #212529;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        #sidebar .nav-link {
            color: #adb5bd;
            padding: 12px 20px;
            margin: 4px 0;
            border-radius: 6px;
        }
        #sidebar .nav-link:hover, #sidebar .nav-link.active {
            color: #fff;
            background: #0d6efd;
        }
        #content {
            margin-left: 260px;
            padding: 30px;
            width: calc(100% - 260px);
        }
    </style>
</head>
<body class="bg-light">

    <!-- SIDEBAR NAVIGATION -->
    <div id="sidebar" class="d-flex flex-column p-3 shadow">
        <a href="{% url 'patient_list' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <span class="fs-5 fw-bold"><i class="bi bi-hospital-fill text-danger me-2"></i>SIMRS Amanah</span>
        </a>
        <hr class="text-secondary">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="{% url 'patient_list' %}" class="nav-link {% if request.resolver_match.url_name == 'patient_list' or request.resolver_match.url_name == 'patient_create' %}active{% endif %}">
                    <i class="bi bi-people-fill me-2"></i> Data Pasien
                </a>
            </li>
            <li>
                <a href="{% url 'appointment_list' %}" class="nav-link {% if 'appointment' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-calendar-check-fill me-2"></i> Antrean / Poli
                </a>
            </li>
            <li>
                <a href="{% url 'medical_record_list' %}" class="nav-link {% if 'medical-record' in request.resolver_match.path %}active{% endif %}">
                    <i class="bi bi-journal-medical me-2"></i> Rekam Medis
                </a>
            </li>
            <li>
                <a href="{% url 'prescription_list' %}" class="nav-link {% if 'prescription' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-capsule me-2"></i> Farmasi & Resep
                </a>
            </li>
        </ul>
        <hr class="text-secondary">
        <div class="dropdown">
            <a href="/admin/" target="_blank" class="d-flex align-items-center text-white text-decoration-none p-2 rounded bg-secondary">
                <i class="bi bi-shield-lock-fill me-2"></i>
                <strong>Django Admin Panel</strong>
            </a>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div id="content">
        <div class="container-fluid">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
