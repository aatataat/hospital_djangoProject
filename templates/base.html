<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIMRS - Amanah Medical Centre{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- DataTables for Bootstrap 5 -->
    <link href="https://cdn.datatables.net/2.3.2/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/3.0.4/css/responsive.bootstrap5.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            overflow-x: hidden;
        }
        #sidebar {
            width: 260px;
            min-height: 100vh;
            background: #212529;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        #sidebar .nav-link {
            color: #adb5bd;
            padding: 12px 20px;
            margin: 4px 0;
            border-radius: 6px;
        }
        #sidebar .nav-link:hover, #sidebar .nav-link.active {
            color: #fff;
            background: #0d6efd;
        }
        #content {
            margin-left: 260px;
            padding: 30px;
            width: calc(100% - 260px);
        }
    </style>
</head>
<body class="bg-light">

    <!-- SIDEBAR NAVIGATION -->
    <div id="sidebar" class="d-flex flex-column p-3 shadow">
        <a href="{% url 'patient_list' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <span class="fs-5 fw-bold"><i class="bi bi-hospital-fill text-danger me-2"></i>SIMRS Amanah</span>
        </a>
        <hr class="text-secondary">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="{% url 'patient_list' %}" class="nav-link {% if request.resolver_match.url_name == 'patient_list' or request.resolver_match.url_name == 'patient_create' %}active{% endif %}">
                    <i class="bi bi-people-fill me-2"></i> Data Pasien
                </a>
            </li>
            <li>
                <a href="{% url 'appointment_list' %}" class="nav-link {% if 'appointment' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-calendar-check-fill me-2"></i> Antrean / Poli
                </a>
            </li>
            <li>
                <a href="{% url 'medical_record_list' %}" class="nav-link {% if 'medical-record' in request.resolver_match.path %}active{% endif %}">
                    <i class="bi bi-journal-medical me-2"></i> Rekam Medis
                </a>
            </li>
            <li>
                <a href="{% url 'prescription_list' %}" class="nav-link {% if 'prescription' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-capsule me-2"></i> Farmasi & Resep
                </a>
            </li>
        </ul>
        <hr class="text-secondary">
        <div class="px-2 mb-2 text-white-50 small">
            Login sebagai: <strong class="text-white">{{ request.user.username }}</strong>
        </div>
        <div class="d-grid gap-2">
            <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm w-100 text-start px-3">
                    <i class="bi bi-box-arrow-left me-2"></i> Logout
                </button>
            </form>
            <a href="/admin/" target="_blank" class="btn btn-secondary btn-sm text-start px-3">
                <i class="bi bi-shield-lock-fill me-2"></i> Django Admin
            </a>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div id="content">
        <div class="container-fluid">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <!-- jQuery and DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.2/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.4/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.4/js/responsive.bootstrap5.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(function () {
            $('.datatable').each(function () {
                const headers = Array.from(this.querySelectorAll('thead th'));
                const actionColumnIndex = headers.findIndex(function (header) {
                    return ['aksi', 'action'].includes(header.textContent.trim().toLowerCase());
                });

                $(this).DataTable({
                    "responsive": true,
                    "lengthChange": true,
                    "autoWidth": false,
                    "pageLength": 10,
                    "lengthMenu": [
                        [10, 25, 50, 100],
                        [10, 25, 50, 100]
                    ],
                    "order": [
                        [0, 'asc']
                    ],
                    "language": {
                        "lengthMenu": "Show _MENU_ entries",
                        "search": "Search:",
                        "info": "Showing _START_ to _END_ of _TOTAL_ entries",
                        "infoEmpty": "Showing 0 to 0 of 0 entries",
                        "infoFiltered": "(filtered from _MAX_ total entries)",
                        "emptyTable": "No data available in table",
                        "zeroRecords": "No matching records found",
                        "paginate": {
                            "first": "First",
                            "last": "Last",
                            "next": "Next",
                            "previous": "Previous"
                        }
                    },
                    "columnDefs": actionColumnIndex >= 0 ? [{
                        "orderable": false,
                        "targets": actionColumnIndex
                    }] : []
                });
            });
        });
    </script>
</body>
</html>
