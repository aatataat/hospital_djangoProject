<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SIMRS - Amanah Medical Centre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6f42c1);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="card login-card p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <i class="bi bi-hospital-fill text-primary display-4"></i>
                <h3 class="fw-bold mt-2">SIMRS Amanah</h3>
                <p class="text-muted small">Silakan login dengan akun Anda</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="alert alert-danger py-2 small">
                    Username atau password yang Anda masukkan salah.
                </div>
                {% endif %}

                <div class="mb-3">
                    <label for="id_username" class="form-label small fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" id="id_username" required placeholder="Masukkan username">
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label small fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" id="id_password" required placeholder="Masukkan password">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </form>
        </div>
    </div>
</body>
</html>
