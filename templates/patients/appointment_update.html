<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Update Status Kunjungan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">Ubah Status Pemeriksaan Pasien</h4>
                    </div>
                    <div class="card-body">
                        <p><strong>No. Registrasi:</strong> {{ appointment.nomor_registrasi }}</p>
                        <p><strong>Nama Pasien:</strong> {{ appointment.patient.nama_lengkap }}</p>
                        <p><strong>Dokter Tujuan:</strong> {{ appointment.doctor.nama_dokter }}</p>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                {{ form.status.label_tag }}
                                {{ form.status }}
                                {{ form.status.errors }}
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="{% url 'appointment_list' %}" class="btn btn-secondary">Kembali</a>
                                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
