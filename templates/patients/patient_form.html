<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pasien - Amanah Medical Centre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Form Pendaftaran Pasien Baru</h4>
                    </div>
                    <div class="card-body">
                        <!-- Method POST wajib di Django, sertakan {% csrf_token %} untuk keamanan (mirip @csrf di Laravel) -->
                        <form method="POST">
                            {% csrf_token %}
                            
                            {{ form.as_p }}

                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'patient_list' %}" class="btn btn-secondary">Kembali</a>
                                <button type="submit" class="btn btn-success">Simpan Data Pasien</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
